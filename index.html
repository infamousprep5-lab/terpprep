  <script>
// English Language Arts / Literacy — Grade 10 MSTAR
// Aligned to the four MSTAR ELA/L claims: Reading Literature, Reading Informational
// Text, Vocabulary Interpretation & Use, and Writing. Item types mirror the real
// test: single-select MC, multi-select MC, and 2–4 point constructed response.

const ela = {
  id: 'ela',
  slug: 'ela',
  theme: 'ela',
  name: 'ELA 10',
  fullName: 'English Language Arts / Literacy — Grade 10 MSTAR',
  tagline: 'Read closely, analyze evidence, and write with purpose.',
  officialUrl: 'https://assessments.msde.maryland.gov/public/ela-10-2025-practice-test',
  accent: 'blue',
  format: {
    structure: '4 sections, 70 minutes each (computer- or paper-based).',
    itemTypes: [
      'Multiple choice — single select',
      'Multiple select — choose all that apply',
      'Technology-enhanced (modeled here as multi-select / evidence pairing)',
      'Constructed response — 2 to 4 points, evidence-based writing',
    ],
    scoring:
      'MC and TE items are machine-scored; constructed responses are scored with a rubric (0–4).',
  },
  domains: [
    { name: 'Reading: Literature', weight: 'Close reading of complex literary texts' },
    { name: 'Reading: Informational Text', weight: 'Analysis of complex nonfiction' },
    { name: 'Vocabulary Interpretation & Use', weight: 'Word meaning from context' },
    { name: 'Writing', weight: 'Argument, informative/explanatory & narrative' },
  ],
  studyTips: [
    'Always return to the text — every answer should be defensible with a quote or detail.',
    'For "which two details" items, eliminate choices that are true but do not answer the question asked.',
    'In writing tasks, name your claim in the first sentence, then organize by reasons, each backed with cited evidence.',
    'Watch for words like "primarily," "most," and "best" — they signal that several answers are partly right.',
  ],
  topics: [
    {
      id: 'reading-lit',
      name: 'Reading: Literature',
      blurb:
        'Analyze theme, character, and an author’s craft in complex literary passages.',
      questions: [
        {
          id: 'ela-rl-1',
          type: 'single',
          passage:
            'From "The Last Lighthouse Keeper"\n\nMara had kept the light for thirty-one winters, and she had never once let it fail. The town below called her stubborn; the shipping company called her obsolete. When the letter arrived announcing the tower would be automated by spring, she folded it neatly and set it on the shelf beside the logbooks, as if it were simply one more record to keep. That night she climbed the one hundred and eight steps as she always had, though her knees now counted every one, and she trimmed a wick that no longer needed trimming.',
          prompt:
            'Which statement best describes what Mara’s actions reveal about her character?',
          choices: [
            { id: 'a', text: 'She is angry and plans to fight the company’s decision.' },
            { id: 'b', text: 'She finds meaning in her duty and holds to routine even as it ends.' },
            { id: 'c', text: 'She is confused by the letter and does not understand its meaning.' },
            { id: 'd', text: 'She is eager to retire and welcomes the automation.' },
          ],
          answer: 'b',
          explanation:
            'Mara files the dismissal letter "as if it were simply one more record" and still climbs the tower to trim a wick "that no longer needed trimming." Her calm devotion to routine shows she finds meaning in the duty itself, even as it is ending.',
        },
        {
          id: 'ela-rl-2',
          type: 'single',
          passage:
            'From "The Last Lighthouse Keeper" (continued)\n\nThe automated beacon, when it came, was brighter and never tired. It did not know the reef by name, or the way fog pooled in the eastern cove, or which nights the fishermen ran late. It only knew to shine.',
          prompt:
            'How does the contrast between Mara and the automated beacon develop a central theme of the passage?',
          choices: [
            { id: 'a', text: 'It suggests that newer technology is always more dangerous than old methods.' },
            { id: 'b', text: 'It emphasizes that efficiency can come at the cost of human knowledge and care.' },
            { id: 'c', text: 'It proves that the town no longer needs a lighthouse at all.' },
            { id: 'd', text: 'It shows that Mara’s knowledge was never actually useful.' },
          ],
          answer: 'b',
          explanation:
            'The beacon is "brighter and never tired," but it "did not know the reef by name" or the local rhythms Mara knew. The contrast develops the theme that efficiency can replace effort without replacing human knowledge and care.',
        },
        {
          id: 'ela-rl-3',
          type: 'multi',
          passage:
            'From "The Last Lighthouse Keeper"\n\nMara had kept the light for thirty-one winters, and she had never once let it fail. The town below called her stubborn; the shipping company called her obsolete. When the letter arrived announcing the tower would be automated by spring, she folded it neatly and set it on the shelf beside the logbooks, as if it were simply one more record to keep. That night she climbed the one hundred and eight steps as she always had, though her knees now counted every one, and she trimmed a wick that no longer needed trimming.\n\nThe automated beacon, when it came, was brighter and never tired. It did not know the reef by name, or the way fog pooled in the eastern cove, or which nights the fishermen ran late. It only knew to shine.',
          prompt:
            'Select the TWO details that best support the idea that Mara’s value comes from personal knowledge rather than mechanical power.',
          choices: [
            { id: 'a', text: '"she trimmed a wick that no longer needed trimming"' },
            { id: 'b', text: '"It did not know the reef by name"' },
            { id: 'c', text: '"The automated beacon... was brighter and never tired"' },
            { id: 'd', text: '"or which nights the fishermen ran late"' },
            { id: 'e', text: '"she had never once let it fail"' },
          ],
          answer: ['b', 'd'],
          explanation:
            'Choices B and D describe knowledge the machine lacks — the reef "by name" and the fishermen’s late nights — which is exactly the human knowledge the passage values. A and E show devotion but not specialized knowledge; C describes the machine’s power, the opposite point.',
        },
        {
          id: 'ela-rl-4',
          type: 'single',
          passage:
            'From a poem, "Inventory"\n\nMy grandmother counts her days in jars—\npeaches in June, tomatoes come fall,\neach lid a small gold moon she seals\nagainst the coming, certain cold.',
          prompt:
            'What does the metaphor of jars most strongly suggest about the grandmother?',
          choices: [
            { id: 'a', text: 'She is wealthy and enjoys collecting expensive objects.' },
            { id: 'b', text: 'She preserves the good of each season to sustain her through hard times.' },
            { id: 'c', text: 'She dislikes the summer and prefers winter weather.' },
            { id: 'd', text: 'She has forgotten how to cook fresh food.' },
          ],
          answer: 'b',
          explanation:
            'Canning "peaches in June" and "tomatoes come fall" to seal "against the coming, certain cold" is a metaphor for storing up the good of each season to endure hardship — a meditation on preparation and resilience.',
        },
        {
          id: 'ela-rl-5',
          type: 'single',
          passage:
            'From a poem, "Inventory"\n\nMy grandmother counts her days in jars—\npeaches in June, tomatoes come fall,\neach lid a small gold moon she seals\nagainst the coming, certain cold.',
          prompt:
            'The phrase "each lid a small gold moon" is an example of which technique, and what is its effect?',
          choices: [
            { id: 'a', text: 'Hyperbole — it exaggerates how many jars there are.' },
            { id: 'b', text: 'Metaphor — it lends ordinary canning lids beauty and quiet significance.' },
            { id: 'c', text: 'Personification — it gives the jars human feelings.' },
            { id: 'd', text: 'Onomatopoeia — it imitates the sound of the lids sealing.' },
          ],
          answer: 'b',
          explanation:
            'Comparing a lid to "a small gold moon" without "like" or "as" is a metaphor. It elevates a humble household task, suggesting the grandmother’s labor has quiet beauty and meaning.',
        },
        {
          id: 'ela-rl-7',
          type: 'single',
          passage:
            'From "Bus Stop in January"\n\nThe shelter’s glass was a fogged map of breath. Maya stamped her feet and counted the minutes the way her mother counted bus fares — carefully, without hope of leftovers. When the headlights finally bloomed at the corner, she did not rush. She waited until the doors sighed open, as if arriving too eagerly might scare the warmth away.',
          prompt: 'What does Maya’s decision not to rush most strongly suggest?',
          choices: [
            { id: 'a', text: 'She is uninterested in reaching her destination.' },
            { id: 'b', text: 'She treats small comforts as fragile and worth approaching carefully.' },
            { id: 'c', text: 'She is angry at the bus driver for being late.' },
            { id: 'd', text: 'She has forgotten which bus she needs.' },
          ],
          answer: 'b',
          explanation:
            'Waiting "as if arriving too eagerly might scare the warmth away" shows she treats the coming warmth as something delicate — a careful, almost protective stance toward a small comfort.',
        },
        {
          id: 'ela-rl-8',
          type: 'single',
          passage:
            'From "Bus Stop in January" (continued)\n\nInside, a stranger offered half a scarf without asking her name. Maya accepted it the way people accept weather — as a fact, not a favor — and only later wondered whether kindness, too, could be a kind of route that runs on time.',
          prompt: 'How does the scarf moment develop Maya’s character?',
          choices: [
            { id: 'a', text: 'It shows she distrusts everyone she meets.' },
            { id: 'b', text: 'It reveals she is used to hardship and slow to name care as personal kindness.' },
            { id: 'c', text: 'It proves she plans to return the scarf immediately.' },
            { id: 'd', text: 'It suggests she is wealthy and often receives gifts.' },
          ],
          answer: 'b',
          explanation:
            'Accepting the scarf "as a fact, not a favor" and only later considering kindness as intentional shows someone accustomed to surviving, not expecting care — a quiet depth of character.',
        },
        {
          id: 'ela-rl-9',
          type: 'multi',
          passage:
            'From "Bus Stop in January"\n\nThe shelter’s glass was a fogged map of breath. Maya stamped her feet and counted the minutes the way her mother counted bus fares — carefully, without hope of leftovers. When the headlights finally bloomed at the corner, she did not rush. She waited until the doors sighed open, as if arriving too eagerly might scare the warmth away.\n\nInside, a stranger offered half a scarf without asking her name. Maya accepted it the way people accept weather — as a fact, not a favor — and only later wondered whether kindness, too, could be a kind of route that runs on time.',
          prompt: 'Select the TWO details that best support the idea that Maya’s life is shaped by scarcity.',
          choices: [
            { id: 'a', text: '"counted the minutes the way her mother counted bus fares — carefully, without hope of leftovers"' },
            { id: 'b', text: '"headlights finally bloomed at the corner"' },
            { id: 'c', text: '"accepted it the way people accept weather — as a fact, not a favor"' },
            { id: 'd', text: '"doors sighed open"' },
            { id: 'e', text: '"fogged map of breath"' },
          ],
          answer: ['a', 'c'],
          explanation:
            'Counting fares "without hope of leftovers" and treating kindness as impersonal "weather" both signal a life trained by scarcity. The other details are atmospheric but do not primarily show scarcity.',
        },
        {
          id: 'ela-rl-10',
          type: 'single',
          passage:
            'From "The Chess Clock"\n\nUncle Ray never played to win so much as to teach. Each lesson ended the same way: he tipped his king, smiled, and said, "Now tell me what I gave you."',
          prompt: 'What does tipping the king most clearly symbolize in this passage?',
          choices: [
            { id: 'a', text: 'Anger at losing a competitive game.' },
            { id: 'b', text: 'A deliberate choice to value teaching over victory.' },
            { id: 'c', text: 'Confusion about the rules of chess.' },
            { id: 'd', text: 'A refusal to speak to his niece again.' },
          ],
          answer: 'b',
          explanation:
            'He "never played to win so much as to teach," and tipping the king while asking what he "gave" shows surrender used as pedagogy — prioritizing learning over winning.',
        },
        {
          id: 'ela-rl-11',
          type: 'cr',
          points: 3,
          passage:
            'Source Texts for Writing\n\nFrom "Bus Stop in January"\n\nThe shelter’s glass was a fogged map of breath. Maya stamped her feet and counted the minutes the way her mother counted bus fares — carefully, without hope of leftovers. When the headlights finally bloomed at the corner, she did not rush. She waited until the doors sighed open, as if arriving too eagerly might scare the warmth away.\n\nInside, a stranger offered half a scarf without asking her name. Maya accepted it the way people accept weather — as a fact, not a favor — and only later wondered whether kindness, too, could be a kind of route that runs on time.\n\nFrom "The Chess Clock"\n\nUncle Ray never played to win so much as to teach. Each lesson ended the same way: he tipped his king, smiled, and said, "Now tell me what I gave you."',
          prompt:
            'Both passages explore how people give or receive care. In a well-organized paragraph, analyze how each text presents care. Use specific evidence from BOTH passages.',
          sampleResponse:
            'Both texts present care as something quiet and intentional rather than flashy. In "Bus Stop in January," a stranger offers "half a scarf without asking her name," and Maya only later realizes kindness can be "a kind of route that runs on time." The care is practical and almost anonymous, yet it reshapes how she understands generosity. In "The Chess Clock," Uncle Ray tips his king and asks what he "gave," showing care as teaching — he sacrifices winning so someone else can learn. Together the passages suggest that care often looks like small, deliberate acts: shared warmth on a bus, or a game lost on purpose so a lesson can be won.',
          rubric: [
            'States a clear controlling idea about how care is shown.',
            'Uses specific evidence from BOTH passages.',
            'Explains how the evidence supports the idea (not only summary).',
            'Organized and clear enough that errors do not block meaning.',
          ],
        },
        {
          id: 'ela-rl-6',
          type: 'cr',
          points: 3,
          passage:
            'Source Texts for Writing\n\nFrom "The Last Lighthouse Keeper"\n\nMara had kept the light for thirty-one winters, and she had never once let it fail. The town below called her stubborn; the shipping company called her obsolete. When the letter arrived announcing the tower would be automated by spring, she folded it neatly and set it on the shelf beside the logbooks, as if it were simply one more record to keep. That night she climbed the one hundred and eight steps as she always had, though her knees now counted every one, and she trimmed a wick that no longer needed trimming.\n\nThe automated beacon, when it came, was brighter and never tired. It did not know the reef by name, or the way fog pooled in the eastern cove, or which nights the fishermen ran late. It only knew to shine.\n\nFrom a poem, "Inventory"\n\nMy grandmother counts her days in jars—\npeaches in June, tomatoes come fall,\neach lid a small gold moon she seals\nagainst the coming, certain cold.',
          prompt:

        'Source Texts for Writing\n\nPassage 1: From "What the Data Say About Phones in Class"\n\n(1) When one district collected phones in locked pouches for a full school year, researchers tracked three measures before and after: minutes of off-task behavior recorded by trained classroom observers, discipline referrals for conflicts that began online, and scores on end-of-unit assessments.\n\n(2) Off-task behavior fell by roughly a third. Referrals tied to online conflict fell by half in the middle schools but barely moved in the high schools. Assessment scores rose slightly, though the increase was small enough to be explained by two other changes the district made the same year.\n\n(3) None of this settles the question. A single district is not a country, and one year is not a trend. What the data do suggest is narrower and more useful: pouches change attention quickly, change social conflict unevenly, and change achievement slowly, if at all.\n\n(4) Policy arguments usually promise more than that. Careful evidence usually promises less.\n\nPassage 2: From "The Pouch Is Not the Point"\n\n(1) I taught for eleven years without a phone policy and three years with one. I can tell you exactly what changed, and it was not test scores.\n\n(2) What changed was the first four minutes of class. Before the pouches, those minutes went to pulling students out of a conversation that had started somewhere else. After, the room simply began. Students looked up. They looked at each other.\n\n(3) I have heard the objection that a locked pouch is a bandage over a wound we refuse to treat — that the real problem is a set of products engineered to hold attention. That objection is right. It is also not an argument for doing nothing while we wait for the wound to heal.\n\n(4) You will not find the first four minutes in a data table. Ask any teacher what they are worth.',

        'You have read two passages about phone policies in schools. Write an essay that analyzes which author more effectively supports the argument he or she makes. Be sure to describe the kind of evidence each author uses, explain the strengths and limits of that evidence, and use specific details from BOTH passages.',
      sampleResponse:
        'Both authors argue about phone pouches, but they disagree about what should count as proof, and Passage 1 supports its argument more effectively because it matches the size of every claim to the evidence behind it. The author of Passage 1 builds from three separate measures — observed off-task minutes, discipline referrals for online conflict, and end-of-unit scores — and then reports results that do not all point the same way: attention improved by "roughly a third," referrals "fell by half in the middle schools but barely moved in the high schools," and scores rose only slightly. Crucially, the author immediately names a threat to that last result, noting the gain "was small enough to be explained by two other changes the district made the same year," and then names the limits of the sample: "A single district is not a country, and one year is not a trend." That willingness to argue against the author’s own strongest-sounding number is what makes the conclusion trustworthy.\n\nThe author of Passage 2 makes a genuinely valuable argument, and it is the more vivid of the two. The image of "the first four minutes of class" is concrete, and the detail that after the change "Students looked up. They looked at each other" captures something a referral count cannot. This author is also fair to the opposition, conceding that pouches may be "a bandage over a wound we refuse to treat" and answering that the objection "is also not an argument for doing nothing." But the evidence itself is a single teacher recalling fourteen years of classes, and the essay closes by placing that experience beyond checking: "You will not find the first four minutes in a data table."\n\nThat closing line is where the comparison turns. A reader can test Passage 1 by asking what the other two district changes were or by looking for a second district; a reader can only agree or disagree with Passage 2. Both essays are honest about their own weak points, which is to their credit, but only one gives the reader the tools to verify it. For that reason, Passage 1 supports its argument more effectively, even though Passage 2 makes the more memorable case.',

        'LITERARY ANALYSIS TASK — Stimulus\n\nText 1: From "The Tide Clock"\n\nGrandpa Ellis kept two clocks in the kitchen. One told the hour. The other, a brass dial the color of an old penny, told the tide... He had worked the Bay for forty-one years, tonging oysters off a deadrise boat his father built, and he measured his life the way the brass dial did — in long, patient arcs. My mother measured hers in shifts at the hospital and in the minutes between them. I had grown up on her clock. I could not read his.\n\nBy noon the culling board held maybe a third of what he said it would have held when he was my age. He did not complain about it. He only said, "You see it now," as if the empty board were a sentence he had been waiting years for me to finish reading.\n\nText 2: From "Persephone at the Greyhound Station"\n\nThe old story says a girl was taken. In this one she buys the ticket herself, at 11:40 on a Tuesday, with money from a summer job her mother does not know about... Her mother will call the leaving a theft. Her mother will make the whole world cold about it. But the girl at gate four is doing arithmetic no myth ever let her do: how many months below, how many above, and who exactly gets to decide.\n\nBoth texts place a young person between an older generation’s way of understanding the world and a choice the young person must make for herself.',
      prompt:
        'LITERARY ANALYSIS: Write an essay that analyzes how each author develops the relationship between a young narrator and an older relative. Consider each author’s use of narration, detail, and figurative language. Use specific evidence from BOTH texts to support your analysis.',
      sampleResponse:
        'Both authors put a young woman in the presence of an older relative whose way of seeing the world she has inherited without choosing, but they build the relationship out of opposite materials: one out of a silence the narrator must interpret, the other out of a story she must revise.\n\n"The Tide Clock" makes the relationship a problem of literacy. The two kitchen clocks are a metaphor for two ways of counting a life — the grandfather’s "long, patient arcs" against the mother’s "shifts at the hospital and the minutes between them" — and the narrator states her difficulty as a reading failure: "I had grown up on her clock. I could not read his." The author then keeps the grandfather nearly wordless so the narrator has to interpret him. When the culling board holds "maybe a third" of what it once did, he says four words, and the narrator supplies the meaning, describing the board "as if it were a sentence he had been waiting years for me to finish reading." Because the whole scene is told in retrospect by an adult, the reader watches understanding arrive late, which is exactly the relationship the author is describing.\n\n"Persephone at the Greyhound Station" builds the same generational distance out of a myth instead of a memory. The author announces the revision in the first two sentences — "The old story says a girl was taken. In this one she buys the ticket herself" — and gives the daughter every detail the traditional version denied her: a departure time, her own money, and the pomegranate seeds she counted herself, "the way you count reasons." The mother appears only in the future tense, as someone who "will call the leaving a theft," which keeps her powerful but places her outside the moment of choice. The essay ends on the real subject, "who exactly gets to decide."\n\nThe two authors therefore develop the same relationship from different directions. In "The Tide Clock," the older relative holds knowledge the young narrator has to work to receive; in "Persephone," the older relative holds a story the young narrator has to work to escape. Read together, they suggest that inheriting a way of seeing and choosing your own are not separate acts but the same difficult one.',

        'COMPARATIVE ANALYSIS OF EVIDENTIARY SUPPORT — Stimulus\n\nPassage 1: From "Grade Inflation Is Real, and Small"\n\nAcross a state system of 180 high schools, average GPA rose 0.21 points over eight years while scores on a common end-of-course exam were flat. That gap is the strongest single indicator of grade inflation available. But the gap was concentrated: in a quarter of the schools it was near zero, and in a tenth it exceeded half a point. Reporting only the statewide average hides the fact that the phenomenon is a local one with local causes — changes in retake policies, in late-work rules, and in how many teachers are new.\n\nPassage 2: From "Stop Blaming the Gradebook"\n\nI have graded roughly nineteen thousand assignments. A grade is not a measurement; it is a message from a teacher to a student about what to do next. When my district banned zeros for missing work, my grades went up. So did the number of students who eventually turned the work in. Call that inflation if you want. I call it a policy that finally stopped using arithmetic to punish teenagers for being fourteen.\n\nBoth authors respond to the claim that grades have become less meaningful.',
      prompt:
        'ARGUMENT / COMPARATIVE ANALYSIS: Which author more effectively supports the argument he or she makes? Write an essay that analyzes the kind of evidence each author uses, explains its strengths and limits, and reaches a reasoned judgment. Use specific evidence from BOTH passages.',
      sampleResponse:
        'Passage 1 supports its argument more effectively, because it treats its own strongest number with suspicion and Passage 2 never has to.\n\nThe author of Passage 1 begins with a comparison that is genuinely persuasive: across 180 schools, average GPA rose 0.21 points while common exam scores "were flat." Rather than resting there, the author breaks the average apart, reporting that in "a quarter of the schools it was near zero" and in "a tenth it exceeded half a point." That move costs the author the more dramatic headline and buys something better — a defensible claim that grade inflation is "a local one with local causes," followed by three candidate causes a reader could actually investigate. The evidence is also checkable: another analyst could pull the same distribution and disagree.\n\nPassage 2 makes an argument that Passage 1 cannot make, and it makes it well. Redefining a grade as "a message from a teacher to a student about what to do next" reframes the entire debate, and the author supplies a real consequence — after the district banned zeros, both grades and the number of students completing work rose. The closing line is the most memorable sentence in either passage. But the support is one teacher’s account of one district, and the crucial second claim, that more students "eventually turned the work in," is offered without any figure at all. A reader who doubts it has no way to test it.\n\nNeither passage is careless. Passage 2 is honest about being a first-person argument and does not pretend to be a study. Still, effectiveness of support is the question, and Passage 1 provides more evidence, provides it in a form that can be verified, and voluntarily qualifies its own conclusion. Passage 2 makes the better case for why we should care about grades; Passage 1 makes the better-supported case for what is actually happening to them.',

        'RESEARCH SIMULATION TASK — Stimulus (three sources)\n\nSource 1: From "The Heat Island Map"\n\nOn an August afternoon, surface temperatures within a single city can differ by more than fifteen degrees. The hottest blocks are consistently those with the least tree canopy and the most unshaded pavement. Because canopy cover in many American cities tracks decades-old housing and lending patterns, the neighborhoods that are hottest today are frequently the ones that were denied investment generations ago.\n\nSource 2: From an interview with a public-works director\n\n"People picture a heat plan as planting trees, and trees matter, but a tree you plant today shades a sidewalk in fifteen years. The things that help this August are cooler roof coatings, shade structures at bus stops, and keeping one air-conditioned public building open late in every neighborhood. Our problem is that the slow fix is popular and photographs well, and the fast fix is a line item nobody applauds."\n\nSource 3: From a county health department summary\n\nEmergency visits for heat-related illness cluster in three groups: outdoor workers, adults over 65 living alone, and residents of buildings without central cooling. During the most recent heat emergency, 71 percent of visits came from residents of blocks in the top quarter for surface temperature. Cooling centers were open, but average travel time to the nearest one exceeded twenty-five minutes for the neighborhoods with the highest visit rates.',
      prompt:
        'INFORMATIVE/EXPLANATORY (RESEARCH SIMULATION): Using all THREE sources, write an essay that explains why extreme heat affects some city neighborhoods far more than others and what makes an effective response difficult. Cite specific evidence from at least two of the sources.',
      sampleResponse:
        'Extreme heat is not distributed evenly across a city, and the reasons are physical, historical, and logistical at the same time. Source 1 establishes the physical mechanism: surface temperatures inside one city can vary "by more than fifteen degrees," and the hottest blocks are "those with the least tree canopy and the most unshaded pavement." It then supplies the historical layer, noting that canopy cover often follows "decades-old housing and lending patterns," so the blocks that overheat today are frequently the ones denied investment generations ago. Heat, in other words, lands on a map that was drawn long before anyone measured it.\n\nSource 3 shows what that map costs. During the most recent heat emergency, 71 percent of emergency visits for heat illness came from residents of blocks in the top quarter for surface temperature, and the people affected were concentrated in three vulnerable groups, including adults over 65 living alone. The same source identifies why an apparently adequate response failed: cooling centers were open, but average travel time to the nearest one "exceeded twenty-five minutes" precisely in the neighborhoods with the highest visit rates. A resource that exists but cannot be reached in time is not yet a solution.\n\nThe public-works director in Source 2 names the difficulty that ties the other two sources together. Tree planting addresses the mechanism Source 1 describes, but "a tree you plant today shades a sidewalk in fifteen years," while the measures that would help during this August — reflective roof coatings, shade at bus stops, one late-open cooled building per neighborhood — are, in the director’s words, "a line item nobody applauds." The response problem is therefore a mismatch of timelines: the visible investment pays off slowly, the invisible one pays off immediately, and public attention rewards the wrong one.\n\nTaken together, the sources explain that unequal heat is produced by unequal shade, inherited from unequal investment, measured in unequal illness, and answered by a system whose incentives favor the slower remedy. An effective plan would have to work on both clocks at once.',

        'NARRATIVE TASK — Stimulus\n\nRead the opening of a story. Then continue it.\n\nThe letter had been in the glove compartment for three weeks, which is how Nadia knew her father had read it. He never put anything away. He only moved things to where he would not have to look at them.\n\nShe found it while hunting for the tire gauge, and she did not open it, and then she did, at a red light, with the engine running and the turn signal counting off seconds like someone tapping a foot.\n\nContinue the narrative. You may take the story anywhere, but keep Nadia and the letter, and keep the story in the same time and place.',
      prompt:

        'The light turned green before she finished the first line, and the car behind her waited a full two seconds before it said anything, which in this town counted as patience.\n\nThe letter was from the community college. It was addressed to her father. It congratulated him on his admission to the welding certificate program and reminded him that the deposit had been due on the eleventh.\n\nNadia pulled into the lot of the hardware store, though she did not need anything from the hardware store. She read it twice more. Her father was fifty-four. He had told her, in March, that the shop was cutting hours, and then he had told her nothing else about it for four months, which she had taken to mean the problem had solved itself.\n\nWhen she got home he was on the porch with the radio on, low, the way he kept it when he was thinking and did not want to be caught at it.\n\n"You went looking for the tire gauge," he said. It was not a question.\n\n"The deposit was due on the eleventh."\n\nHe did not answer for long enough that she heard the whole end of a song. Then he said, "I know when it was due."\n\nAnd that was the thing about her father, she realized, standing on the second step with the letter still in her hand: he had not hidden it because he was ashamed of going back to school at fifty-four. He had hidden it because he had already decided not to go, and he did not want to be talked out of a decision he had made for her.',

        'ARGUMENT TASK — Stimulus\n\nProposal under debate:\n"Our district should adopt a later high school start time, moving first period from 7:30 a.m. to 8:45 a.m."\n\nNotes for writers:\n• Adolescent sleep cycles shift later during the teenage years; most teens do not fall asleep easily before about 11 p.m.\n• Districts that moved start times later have reported improved attendance and, in several cases, fewer crashes among teen drivers.\n• A later high school start usually requires shifting elementary start times earlier, because most districts run one bus fleet in tiers.\n• Earlier elementary start times shift the child-care burden onto families with young children, often before parents leave for work.\n• Later dismissal compresses time for after-school jobs, athletic practices with shared fields, and caring for younger siblings.\n\nTake a position on the proposal. You may use the notes and your own knowledge, and you must address a counterargument.',
      prompt:
        'ARGUMENT: Should the district move the high school start time to 8:45 a.m.? Write an argumentative essay that states a claim, supports it with at least two developed reasons and relevant evidence, and acknowledges and responds to the strongest opposing argument.',
      sampleResponse:
        'The district should move the high school start time to 8:45 a.m., but only as part of a plan that pays for the disruption it creates rather than passing that cost to families with young children.\n\nThe first reason is biological rather than a matter of willpower. Adolescent sleep cycles shift later during the teenage years, so most teenagers cannot reliably fall asleep before about 11 p.m. A 7:30 a.m. first period therefore does not ask students to go to bed earlier; it asks them to sleep less. The measurable effects of correcting this are the second reason. Districts that have moved start times later report better attendance and, in several cases, fewer crashes among teen drivers — outcomes that matter more than any single course grade, because a student who is absent or injured is not learning anything at all.\n\nThe strongest objection is not about teenagers, and it deserves to be answered on its own terms. Because most districts run one bus fleet in tiers, a later high school start usually forces an earlier elementary start, which pushes young children to bus stops before many parents leave for work. Families with the least schedule flexibility absorb that change first. The compressed afternoon is real too: shared athletic fields, after-school jobs, and the students who pick up younger siblings all lose time.\n\nThose costs are arguments for designing the change carefully, not for keeping a schedule that measurably harms students. A district that adopts the later start should fund supervised early-morning space at elementary schools, publish athletic field schedules before the change rather than after it, and protect a defined block for students who work or care for siblings. If the district cannot fund those supports, it should delay the change until it can — because shifting a burden from one group of children to another is not a reform. Done properly, though, the later start delivers better attendance, safer drivers, and rested students, and the district should commit to it.',

        'INFORMATIVE/EXPLANATORY TASK — Stimulus\n\nFrom a museum exhibit panel, "How a Bill Becomes Slow"\n\nA bill introduced in the Maryland General Assembly is assigned to a committee, where most bills stop. A committee chair decides whether the bill receives a hearing. If it does, the bill can be amended, voted out favorably, voted out unfavorably, or simply left without a vote when the session ends.\n\nThe General Assembly meets in a regular session of ninety days. Bills that do not pass both chambers before adjournment die and must be reintroduced the following year. Supporters describe the short session as a discipline that forces priorities; critics describe it as a bottleneck in which a single chair can end a bill without a recorded vote.\n\nExplain the process and the disagreement about it. Do not argue for a side.',

      sampleResponse:
        'Two features of the Maryland legislative process do most of the work of deciding which bills become law, and neither one is a floor vote. The first is the committee stage. Every introduced bill is assigned to a committee, and the panel notes that this is where "most bills stop." A committee chair controls whether a bill even receives a hearing, and a bill that gets one can still be amended, voted out favorably, voted out unfavorably, or left without any vote at all. That last outcome matters most, because a bill can end without any legislator ever going on record about it.\n\nThe second feature is time. The General Assembly meets in a regular session of ninety days, and bills that have not passed both chambers by adjournment die and must be reintroduced the next year. The short calendar interacts with the committee stage: a chair does not have to defeat a bill, only delay it past the deadline.\n\nObservers draw opposite conclusions from the same design. Supporters describe the compressed session as a discipline, arguing that a hard deadline forces legislators to rank priorities instead of debating everything at once. Critics describe the same structure as a bottleneck, focusing on the fact that a single chair can end a bill without a recorded vote and therefore without accountability to voters. The disagreement is less about the facts of the process than about what a legislature is for — whether the greater risk is passing too much or quietly stopping too much.',

const STORAGE_KEY = 'terp-prep-progress-v1';
const subjects = [ela, misa, government, algebra];

const themes = {
  ela: { bar: 'fill-ela' },
  misa: { bar: 'fill-misa' },
  gov: { bar: 'fill-gov' },
  alg: { bar: 'fill-alg' },
};
function themeOf(s) { return themes[s.theme] || themes.ela; }

function countQ(s) { return s.topics.reduce((n, t) => n + t.questions.length, 0); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sameSet(a = [], b = []) {
  if (a.length !== b.length) return false;
  const sb = new Set(b);
  return a.every((x) => sb.has(x));
}

function readProgress() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch { return {}; }
}

function writeProgress(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function statsFor(slug) {
  const data = readProgress();
  const subject = subjects.find((s) => s.slug === slug);
  const total = countQ(subject);
  const entry = data[slug];
  if (!entry) return { total, answered: 0, correct: 0, pct: 0, accuracy: 0, sessions: [] };
  const answered = Object.keys(entry.answered || {}).length;
  const correct = Object.keys(entry.correct || {}).length;
  return {
    total,
    answered,
    correct,
    pct: total ? Math.round((answered / total) * 100) : 0,
    accuracy: answered ? Math.round((correct / answered) * 100) : 0,
    sessions: entry.sessions || [],
  };
}

function recordSession(slug, label, results) {
  const data = readProgress();
  const subject = data[slug] || { answered: {}, correct: {}, sessions: [] };
  const answered = { ...subject.answered };
  const correct = { ...subject.correct };
  let score = 0;
  results.forEach((r) => {
    answered[r.id] = true;
    if (r.isCorrect) { correct[r.id] = true; score++; }
    else if (r.selfGraded === false) delete correct[r.id];
  });
  const gradable = results.filter((r) => r.gradable);
  const sessions = [...(subject.sessions || []), {
    ts: Date.now(), label, score, total: gradable.length, count: results.length,
  }].slice(-25);
  data[slug] = { answered, correct, sessions };
  writeProgress(data);
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function nl(str) {
  return esc(str).replace(/\n/g, '<br>');
}

const state = {
  view: 'home', // home | subject | quiz | results | official-setup | official | official-results
  slug: null,
  mode: null,
  questions: [],
  label: '',
  ebas: null,
  index: 0,
  answers: {},
  checked: {},
  selfGrade: {},
  ebasOpen: true,
  // Official Test Mode
  setupSlug: 'ela',
  setupTimed: true,
  official: null,
};

const app = document.getElementById('app');

function goHome() {
  stopOfficialTimer();
  state.official = null;
  state.view = 'home';
  render();
}

function goSubject(slug) {
  stopOfficialTimer();
  state.official = null;
  state.view = 'subject';
  state.slug = slug;
  render();
}

function startQuiz(slug, mode) {
  const subject = subjects.find((s) => s.slug === slug);
  let questions, label, ebas = null;
  if (mode === 'full') {
    questions = shuffle(subject.topics.flatMap((t) =>
      t.questions.map((q) => ({ ...q, topicName: t.name, ...(t.ebas ? { ebas: t.ebas } : {}) }))
    ));
    label = subject.name + ' · Full practice test';
  } else {
    const topic = subject.topics.find((t) => t.id === mode);
    questions = shuffle(topic.questions);
    label = subject.name + ' · ' + topic.name;
    ebas = topic.ebas || null;
  }
  state.view = 'quiz';
  state.slug = slug;
  state.mode = mode;
  state.questions = questions;
  state.label = label;
  state.ebas = ebas;
  state.index = 0;
  state.answers = {};
  state.checked = {};
  state.selfGrade = {};
  state.ebasOpen = true;
  render();
}

function finishQuiz() {
  const results = state.questions.map((q) => {
    if (q.type === 'cr') {
      const graded = state.selfGrade[q.id];
      return { id: q.id, gradable: graded !== undefined, isCorrect: graded === true, selfGraded: graded };
    }
    const ok = q.type === 'single'
      ? state.answers[q.id] === q.answer
      : sameSet(state.answers[q.id] || [], q.answer || []);
    return { id: q.id, gradable: true, isCorrect: ok };
  });
  recordSession(state.slug, state.label, results);
  state.view = 'results';
  state._lastResults = results;
  render();
}

function render() {
  if (state.view === 'home') app.innerHTML = renderHome();
  else if (state.view === 'subject') app.innerHTML = renderSubject();
  else if (state.view === 'quiz') app.innerHTML = renderQuiz();
  else if (state.view === 'results') app.innerHTML = renderResults();
  else if (state.view === 'official-setup') app.innerHTML = renderOfficialSetup();
  else if (state.view === 'official') app.innerHTML = renderOfficial();
  else if (state.view === 'official-results') app.innerHTML = renderOfficialResults();
  bind();
}

function renderQuiz() {
  const s = subjects.find((x) => x.slug === state.slug);
  const q = state.questions[state.index];
  const isChecked = !!state.checked[q.id];
  const answer = state.answers[q.id];
  const isLast = state.index === state.questions.length - 1;
  const ebas = q.ebas || state.ebas;
  const progressPct = ((state.index + (isChecked ? 1 : 0)) / state.questions.length) * 100;

  if (isChecked && q.type !== 'cr') {

      : '';
    feedback = `<div class="panel"><p class="sub">Sample response</p><p>${model}</p></div>
      ${rubricHtml}
      <p>Score this only if you want it in your saved accuracy.</p>
      <p>
        <button type="button" data-action="grade" data-val="true" class="btn${grade === true ? '' : ' btn-ghost'}">Met the rubric</button>
        <button type="button" data-action="grade" data-val="false" class="btn${grade === false ? '' : ' btn-ghost'}">Did not</button>
      </p>`;
  }

  const canCheck = q.type === 'cr'
    ? true
    : q.type === 'multi'
      ? Array.isArray(answer) && answer.length > 0
      : !!answer;

  let ebasHtml = '';
  if (ebas) {
    ebasHtml = `<div class="panel">
      <button type="button" data-action="toggle-ebas" class="linkish">Sources — ${state.ebasOpen ? 'hide' : 'show'}</button>
      ${state.ebasOpen ? `<p><strong>${esc(ebas.compellingQuestion)}</strong></p><p class="sub">${esc(ebas.background)}</p>${ebas.sources.map((src) => `<div class="passage"><strong>${esc(src.label)}</strong> <span class="sub">${esc(src.citation)}</span><br>${esc(src.text)}</div>`).join('')}` : ''}
    </div>`;
  }

  const sheet = s.sheet ? `<details class="sheet"><summary>Formula sheet</summary>${s.sheet}</details>` : '';

  return siteHeader(s.slug) + `
  <main class="wrap">
    <div class="quiz-top">
      <button type="button" data-action="subject" data-slug="${s.slug}" class="linkish">Back to ${esc(s.name)}</button>
      <span>Question ${state.index + 1} of ${state.questions.length}</span>
    </div>
    <div class="meter"><div class="meter-fill ${themeOf(s).bar}" style="width:${progressPct}%"></div></div>
    <p class="qmeta">${esc(state.label)}${q.topicName && state.mode === 'full' ? ' · ' + esc(q.topicName) : ''} · ${typeLabel}</p>

      ${body}
      ${feedback}
      <div class="actions">

        <span>
          ${!isChecked
            ? (q.type === 'cr'
              ? `<button type="button" data-action="check" class="btn">Show sample and rubric</button>
                 <button type="button" data-action="skip-cr" class="btn btn-ghost">Skip</button>`

  </main>`;
}

let officialTimer = null;

function fmtClock(sec) {
  const s = Math.max(0, Math.floor(sec));
  const m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function shortHash(str) {
  let h = 5381;
  const s = String(str || '');
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

/* Split a subject's topics into n contiguous sections, balancing item counts
   while keeping each topic (and therefore each shared stimulus / EBAS) intact. */
function splitTopics(topics, n) {
  const remaining = [...topics];
  const groups = [];
  for (let g = 0; g < n && remaining.length; g++) {
    const slotsLeft = n - g;
    if (remaining.length <= slotsLeft) { groups.push([remaining.shift()]); continue; }
    const totalLeft = remaining.reduce((a, t) => a + t.questions.length, 0);
    const target = totalLeft / slotsLeft;
    const take = [];
    let acc = 0;
    while (remaining.length > slotsLeft - 1 && (acc === 0 || acc + remaining[0].questions.length / 2 <= target)) {
      const t = remaining.shift();
      take.push(t);
      acc += t.questions.length;
    }
    groups.push(take);
  }
  return groups.filter((g) => g.length);
}

/* ---- Highlight ranges: stored as sorted, non-overlapping {s,e,c} on the
   plain source string, so they survive every full re-render. ---- */
function hlSubtract(list, s, e) {
  const out = [];
  (list || []).forEach((r) => {
    if (r.e <= s || r.s >= e) { out.push(r); return; }
    if (r.s < s) out.push({ s: r.s, e: s, c: r.c });
    if (r.e > e) out.push({ s: e, e: r.e, c: r.c });
  });
  return out.sort((a, b) => a.s - b.s);
}

function hlAdd(list, s, e, c) {
  const out = hlSubtract(list, s, e);
  out.push({ s, e, c });
  return out.sort((a, b) => a.s - b.s);
}

function hlRender(text, ranges) {
  const src = String(text || '');
  if (!ranges || !ranges.length) return esc(src);
  let out = '';
  let pos = 0;
  ranges.forEach((r) => {
    const s = Math.max(pos, Math.min(r.s, src.length));
    const e = Math.max(s, Math.min(r.e, src.length));
    if (e <= s) return;
    out += esc(src.slice(pos, s));
    out += '<mark class="exam-hl hl-' + esc(r.c) + '">' + esc(src.slice(s, e)) + '</mark>';
    pos = e;
  });
  return out + esc(src.slice(pos));
}

/* Highlights on a shared stimulus are keyed by the stimulus text, so two items
   that quote the same passage share your marks - as they do on the real test. */
function hlKey(q, scope) {
  if (scope === 'passage') return 'p:' + shortHash(q.passage);
  if (scope === 'prompt') return 'q:' + q.id;
  return 'e:' + (q.topicId || '') + ':' + scope;
}

function hlBlock(text, q, scope, cls) {
  const key = hlKey(q, scope);
  const ranges = state.official.highlights[key] || [];
  return `<div class="exam-text ${cls}" data-hl-scope="${esc(scope)}" data-hl-key="${esc(key)}">${hlRender(text, ranges)}</div>`;
}

function officialSection() {

function officialAnswered(q) {
  const v = state.official.answers[q.id];
  if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
  if (q.type === 'cr') return typeof v === 'string' && v.trim().length > 0;
  return !!v;
}

function startOfficial(slug, timed) {
  const subject = subjects.find((s) => s.slug === slug);
  const profile = officialProfiles[slug];
  const groups = splitTopics(subject.topics, profile.sections);
  const questions = [];
  const sections = groups.map((group, gi) => {
    const start = questions.length;
    group.forEach((t) => t.questions.forEach((q) => questions.push({
      ...q,
      topicName: t.name,
      topicId: t.id,
      ...(t.ebas ? { ebas: t.ebas } : {}),
    })));
    return {
      start,
      end: questions.length,
      label: profile.sectionWord + ' ' + (gi + 1),
      topics: group.map((t) => t.name),
    };
  });

  const w = typeof window !== 'undefined' ? window.innerWidth : 1200;
  state.official = {
    slug,
    timed: !!timed,
    questions,
    sections,
    section: 0,
    index: 0,
    answers: {},
    flags: {},
    eliminated: {},
    masked: {},
    notes: {},
    highlights: {},
    globalNote: '',
    selfGrade: {},
    tool: { highlighter: false, eliminator: false, masking: false, notepad: false, lineReader: false, calculator: false, references: false, help: false },
    hlColor: profile.highlightColors[0],
    hlErase: false,
    zoom: 100,
    contrast: '',
    lineWindow: 56,
    noteTab: 'item',
    notePos: { x: Math.max(16, w - 372), y: 168 },
    noteSize: { w: 340, h: 280 },
    calcPos: { x: Math.max(16, w - 740), y: 200 },
    calcExpr: '',
    calcDeg: true,
    refPos: { x: 80, y: 200 },
    secondsLeft: timed ? profile.sectionMinutes * 60 : 0,
    elapsed: 0,
    showReview: false,
    sectionExpired: false,
    submitted: false,
    results: null,
  };
  state.view = 'official';
  state.slug = slug;
  startOfficialTimer();
  render();
}

function startOfficialTimer() {
  stopOfficialTimer();
  officialTimer = setInterval(officialTick, 1000);
}

function stopOfficialTimer() {
  if (officialTimer) { clearInterval(officialTimer); officialTimer = null; }
}

function officialTick() {
  const o = state.official;
  if (!o || o.submitted) { stopOfficialTimer(); return; }
  o.elapsed++;
  const el = document.getElementById('exam-timer');
  if (!o.timed) {
    if (el) el.textContent = fmtClock(o.elapsed);
    return;
  }
  o.secondsLeft = Math.max(0, o.secondsLeft - 1);
  if (el) {
    el.textContent = fmtClock(o.secondsLeft);
    el.style.color = o.secondsLeft <= 300 ? '#e11d48' : '';
  }
  if (o.secondsLeft === 0) advanceSection(true);
}

function advanceSection(expired) {
  const o = state.official;
  const profile = officialProfiles[o.slug];
  if (o.section >= o.sections.length - 1) { submitOfficial(); return; }
  o.section++;
  o.index = o.sections[o.section].start;
  o.showReview = false;
  o.sectionExpired = !!expired;
  if (o.timed) o.secondsLeft = profile.sectionMinutes * 60;
  if (!sectionHasCalc(profile, o.section)) o.tool.calculator = false;
  render();
}

function submitOfficial() {
  const o = state.official;
  if (o.submitted) return;
  stopOfficialTimer();
  const results = o.questions.map((q) => {
    if (q.type === 'cr') {
      // Constructed responses are hand-scored after the real test, so they are
      // not machine-gradable here either - the student rubric-scores them on
      // the results screen.
      return { id: q.id, gradable: false, isCorrect: false };
    }
    const a = o.answers[q.id];
    const ok = q.type === 'single' ? a === q.answer : sameSet(a || [], q.answer || []);
    return { id: q.id, gradable: true, isCorrect: ok };
  });
  const subject = subjects.find((s) => s.slug === o.slug);
  const label = subject.name + ' · Official format' + (o.timed ? ' (timed)' : ' (untimed)');
  recordSession(o.slug, label, results);
  o.submitted = true;
  o.results = results;
  o.label = label;
  state.view = 'official-results';
  render();
}

function exitOfficial(force) {
  const o = state.official;
  if (!force && o && !o.submitted) {
    if (!confirm('Leave the official test? Your answers, highlights and notes for this attempt will be discarded — just like exiting the real testing platform.')) return;
  }
  stopOfficialTimer();
  state.official = null;
  goSubject(state.slug);
}

/* Progress bookkeeping for rubric self-scores made after submitting, without
   logging a duplicate session. */
function applySelfScore(slug, qid, ok) {
  const data = readProgress();
  const entry = data[slug] || { answered: {}, correct: {}, sessions: [] };
  const answered = { ...entry.answered, [qid]: true };
  const correct = { ...entry.correct };
  if (ok) correct[qid] = true; else delete correct[qid];
  data[slug] = { answered, correct, sessions: entry.sessions || [] };
  writeProgress(data);
}

/* ---- Scientific calculator (MISA, and Algebra I sections 2-4). Hand-written parser, no eval. ---- */
function calcEval(expr, deg) {
  const src = String(expr).replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/π/g, 'pi').replace(/√/g, 'sqrt');
  let i = 0;
  const toRad = (x) => (deg ? (x * Math.PI) / 180 : x);
  const fns = {
    sqrt: Math.sqrt, ln: Math.log, log: (x) => Math.log(x) / Math.LN10,
    sin: (x) => Math.sin(toRad(x)), cos: (x) => Math.cos(toRad(x)), tan: (x) => Math.tan(toRad(x)),
    abs: Math.abs,
  };
  const fnNames = Object.keys(fns);
  function peek() { return src[i]; }
  function expression() {
    let v = term();
    while (peek() === '+' || peek() === '-') { const op = src[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
    return v;
  }
  function term() {
    let v = power();
    while (peek() === '*' || peek() === '/') { const op = src[i++]; const r = power(); v = op === '*' ? v * r : v / r; }
    return v;
  }
  function power() {
    const base = unary();
    if (peek() === '^') { i++; return Math.pow(base, power()); }
    return base;
  }
  function unary() {
    if (peek() === '-') { i++; return -unary(); }
    if (peek() === '+') { i++; return unary(); }
    return primary();
  }
  function primary() {
    if (peek() === '(') {
      i++;
      const v = expression();
      if (peek() === ')') i++; else throw new Error('unbalanced');
      return v;
    }
    for (let k = 0; k < fnNames.length; k++) {
      const name = fnNames[k];
      if (src.startsWith(name, i)) { i += name.length; return fns[name](unary()); }
    }
    if (src.startsWith('pi', i)) { i += 2; return Math.PI; }
    if (peek() === 'e') { i++; return Math.E; }
    const start = i;
    while (i < src.length && /[0-9.]/.test(src[i])) i++;
    if (start === i) throw new Error('unexpected');
    return parseFloat(src.slice(start, i));
  }
  const value = expression();
  if (i < src.length) throw new Error('trailing');
  if (!isFinite(value)) throw new Error('range');
  return value;
}

function renderExamTools() {

    const on = !!o.tool[tool];
    return `<button data-action="o-tool" data-tool="${tool}" class="rounded-md px-2.5 py-1.5 text-xs font-bold ${on ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">${esc(label)}</button>`;

  const contrast = contrastModes.find((c) => c.id === o.contrast) || contrastModes[0];
  return `
    <div class="exam-bar flex flex-wrap items-center gap-1.5 border-t border-slate-200 bg-white px-4 py-1.5">
      <span class="exam-muted mr-1 text-[10px] font-bold uppercase tracking-wide text-slate-400">Tools</span>
      ${btn('highlighter', 'Highlighter')}
      ${btn('eliminator', 'Answer eliminator')}
      ${btn('masking', 'Answer masking')}
      ${btn('notepad', 'Notepad')}
      ${btn('lineReader', 'Line reader')}
      ${btn('calculator', 'Calculator')}
      ${btn('references', 'References')}
      ${p.tools.includes('zoom') ? `<span class="ml-1 inline-flex items-center overflow-hidden rounded-md bg-slate-100">
        <button data-action="o-zoom" data-dir="out" class="px-2 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-200">&minus;</button>
        <button data-action="o-zoom" data-dir="reset" class="px-1.5 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-200">${o.zoom}%</button>
        <button data-action="o-zoom" data-dir="in" class="px-2 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-200">+</button>
      </span>` : ''}
      ${p.tools.includes('contrast') ? `<button data-action="o-contrast" class="rounded-md bg-slate-100 px-2.5 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-200">Contrast: ${esc(contrast.name)}</button>` : ''}
      <button data-action="o-tool" data-tool="help" class="ml-auto rounded-md bg-slate-100 px-2.5 py-1.5 text-xs font-bold text-slate-700 hover:bg-slate-200">? Tool help</button>
    </div>
    ${o.tool.highlighter ? `<div class="exam-bar flex flex-wrap items-center gap-2 border-t border-slate-200 bg-amber-50 px-4 py-1.5">
      <span class="text-[11px] font-bold uppercase tracking-wide text-slate-500">Highlighter — select text to mark it</span>
      ${p.highlightColors.map((c) => `<button data-action="o-hlcolor" data-color="${c}" title="${c}" class="h-6 w-6 rounded border-2 hl-${c} ${o.hlColor === c && !o.hlErase ? 'border-slate-900' : 'border-slate-300'}"></button>`).join('')}
      <button data-action="o-hlerase" class="rounded-md px-2.5 py-1.5 text-xs font-bold ${o.hlErase ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 ring-1 ring-slate-300'}">Eraser</button>
      <button data-action="o-hlclear" class="rounded-md bg-white px-2.5 py-1.5 text-xs font-bold text-slate-700 ring-1 ring-slate-300">Clear all</button>
    </div>` : ''}`;
}

function renderExamItem() {
  const o = state.official;
  const p = officialProfiles[o.slug];
  const q = officialQ();
  const sec = officialSection();
  const answer = o.answers[q.id];
  const elim = o.eliminated[q.id] || {};
  const mask = o.masked[q.id] || {};
  const ebas = q.ebas;

  let body = '';
  if (q.type === 'single' || q.type === 'multi') {
    if (q.type === 'multi') body += '<p class="exam-muted mb-2 text-xs font-bold uppercase tracking-wide text-slate-500">Select all that apply</p>';
    body += `<div class="space-y-2.5">${q.choices.map((c) => {
      const selected = q.type === 'multi' ? (Array.isArray(answer) && answer.includes(c.id)) : answer === c.id;
      const off = !!elim[c.id] || !!mask[c.id];
      return `<div class="exam-choice flex items-start gap-2 rounded-lg border-2 bg-white p-3 ${selected ? 'border-slate-900' : 'border-slate-200'}">
        ${p.tools.includes('masking') && o.tool.masking ? `<button data-action="o-mask" data-cid="${c.id}" title="Hide or show this choice" class="mt-0.5 shrink-0 rounded border border-slate-300 px-1.5 py-0.5 text-[11px] font-bold text-slate-500 hover:bg-slate-100">${mask[c.id] ? 'show' : 'hide'}</button>` : ''}
        <button data-action="o-choose" data-cid="${c.id}" class="flex flex-1 items-start gap-3 text-left">
          <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center border-2 text-[11px] font-bold ${q.type === 'multi' ? 'rounded-md' : 'rounded-full'} ${selected ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-300 text-slate-400'}">${c.id.toUpperCase()}</span>
          <span class="text-sm leading-relaxed ${elim[c.id] ? 'exam-elim' : ''} ${mask[c.id] ? 'exam-masked' : ''}">${esc(c.text)}</span>
        </button>
        ${o.tool.eliminator ? `<button data-action="o-elim" data-cid="${c.id}" title="Cross out this choice" class="mt-0.5 shrink-0 rounded border px-1.5 py-0.5 text-[11px] font-bold ${elim[c.id] ? 'border-rose-500 bg-rose-500 text-white' : 'border-slate-300 text-slate-500 hover:bg-slate-100'}">&#10005;</button>` : ''}
      </div>`;
    }).join('')}</div>`;
    if (o.tool.eliminator) body += '<p class="exam-muted mt-2 text-xs text-slate-500">Answer eliminator is on: click a choice to cross it out. Crossed-out choices cannot be selected.</p>';
  } else {
    body = `<textarea data-action="o-text" rows="10" class="exam-panel w-full resize-y rounded-lg border-2 border-slate-200 bg-white p-4 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-slate-300" placeholder="Type your response here.">${esc(answer || '')}</textarea>
      <p class="exam-muted mt-1.5 text-xs text-slate-500">${q.points ? 'Worth up to ' + q.points + ' points. ' : ''}On the real test this is hand-scored against a rubric — you will score it yourself after you turn the test in.</p>`;
  }

  return `
    ${o.sectionExpired ? `<div class="mb-4 rounded-lg border-l-4 border-amber-500 bg-amber-50 p-3 text-sm font-semibold text-amber-900">Time expired on the previous ${esc(p.sectionWord.toLowerCase())}. You are now in ${esc(sec.label)} and cannot return to earlier ${esc(p.sectionWord.toLowerCase())}s.</div>` : ''}
    ${Array.isArray(p.calculatorSections) ? `<p class="exam-muted mb-3 text-sm">${sectionHasCalc(p, o.section) ? 'Calculator section. The toolbar calculator is a scientific calculator. On the real test this section has a Desmos graphing calculator.' : 'Non-calculator section. The calculator stays off, same as Section 1 of Algebra I.'}</p>` : ''}
    ${ebas ? `<div class="exam-card mb-4 rounded-lg border-2 border-slate-200 bg-white p-5">
      <div class="exam-muted text-[11px] font-bold uppercase tracking-wide text-slate-500">Evidence-Based Argument Set — source material</div>
      <p class="mt-2 font-bold">${esc(ebas.compellingQuestion)}</p>
      ${hlBlock(ebas.background, q, 'ebas-bg', 'exam-muted mt-2 text-sm text-slate-600')}
      <div class="mt-3 space-y-3">${ebas.sources.map((src, si) => `
        <div class="exam-stim rounded-lg bg-slate-50 p-4">
          <div class="flex flex-wrap justify-between gap-2"><span class="font-bold">${esc(src.label)}</span><span class="exam-muted text-xs italic text-slate-500">${esc(src.citation)}</span></div>
          ${hlBlock(src.text, q, 'ebas-src-' + si, 'mt-1.5 text-sm')}
        </div>`).join('')}</div>
    </div>` : ''}
    <div class="exam-card rounded-lg border-2 border-slate-200 bg-white p-6">
      <div class="mb-4 flex flex-wrap items-center gap-2">
        <span class="rounded bg-slate-900 px-2 py-1 text-[11px] font-bold text-white">Item ${o.index - sec.start + 1}</span>
        <span class="exam-muted rounded bg-slate-100 px-2 py-1 text-[11px] font-semibold text-slate-600">${esc(q.topicName)}</span>
        <span class="exam-muted rounded bg-slate-100 px-2 py-1 text-[11px] font-semibold text-slate-600">${q.type === 'single' ? 'Selected response' : q.type === 'multi' ? 'Multiple select' : 'Constructed response' + (q.points ? ' · ' + q.points + ' pt' : '')}</span>
        ${o.flags[q.id] ? '<span class="rounded bg-amber-400 px-2 py-1 text-[11px] font-bold text-amber-950">&#9733; Bookmarked</span>' : ''}
      </div>
      ${q.passage ? hlBlock(q.passage, q, 'passage', 'exam-stim mb-5 rounded-lg border-l-4 border-slate-300 bg-slate-50 p-4 text-[15px] leading-relaxed') : ''}
      ${hlBlock(q.prompt, q, 'prompt', 'mb-4 text-lg font-semibold leading-snug')}
      ${body}
    </div>`;
}

function renderExamReview() {
  const o = state.official;
  const p = officialProfiles[o.slug];
  const sec = officialSection();
  const isLastSection = o.section === o.sections.length - 1;
  const items = [];
  for (let i = sec.start; i < sec.end; i++) items.push(i);
  const unanswered = items.filter((i) => !officialAnswered(o.questions[i])).length;
  const flagged = items.filter((i) => o.flags[o.questions[i].id]).length;
  return `
    <div class="exam-card rounded-lg border-2 border-slate-200 bg-white p-6">
      <h2 class="text-xl font-bold">${esc(sec.label)} review</h2>
      <p class="exam-muted mt-1 text-sm text-slate-500">${items.length} items · ${unanswered} unanswered · ${flagged} bookmarked. Click any item to go back to it.</p>
      <div class="mt-5 flex flex-wrap gap-3 text-xs font-semibold">
        <span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded border-2 border-slate-900 bg-slate-900"></span>Answered</span>
        <span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded border-2 border-slate-300 bg-white"></span>Not answered</span>
        <span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded border-2 border-amber-500 bg-amber-300"></span>Bookmarked</span>
      </div>
      <div class="mt-4 grid grid-cols-5 gap-2 sm:grid-cols-8 md:grid-cols-10">${items.map((i) => {
        const q = o.questions[i];
        const done = officialAnswered(q);
        const flag = o.flags[q.id];
        const cls = flag ? 'border-amber-500 bg-amber-300 text-amber-950' : done ? 'border-slate-900 bg-slate-900 text-white' : 'border-slate-300 bg-white text-slate-600';
        return `<button data-action="o-goto" data-i="${i}" class="rounded-lg border-2 py-2.5 text-sm font-bold ${cls}">${i - sec.start + 1}${flag ? ' &#9733;' : ''}</button>`;
      }).join('')}</div>
      <div class="mt-6 flex flex-wrap gap-3 border-t border-slate-200 pt-5">
        <button data-action="o-review" class="rounded-lg bg-white px-4 py-2.5 text-sm font-bold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50">Return to test</button>
        <button data-action="o-turnin" class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-bold text-white hover:bg-slate-700">${isLastSection ? 'Turn in test' : 'Turn in ' + esc(sec.label) + ' -&gt;'}</button>
      </div>
      ${!isLastSection ? `<p class="exam-muted mt-3 text-xs text-slate-500">Once you turn in this ${esc(p.sectionWord.toLowerCase())} you cannot return to it — the same rule applies on the real test.</p>` : ''}
    </div>`;
}

function renderExamNotepad() {
  const o = state.official;
  const q = officialQ();

  const value = isItem ? (o.notes[q.id] || '') : o.globalNote;
  return `
    <div id="exam-notepad" class="exam-float exam-panel flex flex-col overflow-hidden rounded-lg border-2 border-slate-400 bg-white" style="left:${o.notePos.x}px; top:${o.notePos.y}px; width:${o.noteSize.w}px; height:${o.noteSize.h}px;">
      <div data-drag="note" class="exam-grip flex items-center justify-between border-b border-slate-300 bg-slate-100 px-3 py-1.5">
        <span class="text-xs font-bold">Notepad</span>

      </div>
      <div class="flex gap-1 border-b border-slate-200 px-2 py-1.5">
        <button data-action="o-notetab" data-tab="item" class="rounded px-2 py-1 text-[11px] font-bold ${isItem ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">This item</button>
        <button data-action="o-notetab" data-tab="test" class="rounded px-2 py-1 text-[11px] font-bold ${!isItem ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">Whole test</button>
      </div>
      <textarea data-action="o-note" class="exam-panel grow resize-none bg-white p-3 text-sm leading-relaxed focus:outline-none" placeholder="${isItem ? 'Notes for this item only.' : 'Notes for the whole test.'}">${esc(value)}</textarea>

function renderExamCalculator() {
  const o = state.official;
  const pad = ['7', '8', '9', '/', '4', '5', '6', '*', '1', '2', '3', '-', '0', '.', '=', '+'];
  const sci = ['(', ')', '^', 'sqrt', 'ln', 'log', 'sin', 'cos', 'tan', 'pi'];
  const sciLabel = { sqrt: '&radic;', pi: '&pi;', '^': 'x&#8319;' };
  return `
    <div id="exam-calc" class="exam-float exam-panel w-64 overflow-hidden rounded-lg border-2 border-slate-400 bg-white" style="left:${o.calcPos.x}px; top:${o.calcPos.y}px;">
      <div data-drag="calc" class="exam-grip flex items-center justify-between border-b border-slate-300 bg-slate-100 px-3 py-1.5">
        <span class="text-xs font-bold">Scientific calculator</span>
        <button data-action="o-tool" data-tool="calculator" class="px-1 text-sm font-bold text-slate-500 hover:text-slate-900">&#10005;</button>
      </div>
      <div class="border-b border-slate-200 px-3 py-2 text-right font-mono text-sm break-all min-h-[2.5rem]">${esc(o.calcExpr || '0')}</div>
      <div class="flex items-center justify-between px-2 py-1">
        <button data-action="o-calcdeg" class="rounded bg-slate-100 px-2 py-1 text-[11px] font-bold text-slate-700">${o.calcDeg ? 'DEG' : 'RAD'}</button>
        <div class="flex gap-1">
          <button data-action="o-calc" data-k="C" class="rounded bg-slate-200 px-2 py-1 text-[11px] font-bold">C</button>
          <button data-action="o-calc" data-k="back" class="rounded bg-slate-200 px-2 py-1 text-[11px] font-bold">&#9003;</button>
        </div>
      </div>
      <div class="grid grid-cols-5 gap-1 px-2 pb-1">${sci.map((k) => `<button data-action="o-calc" data-k="${esc(k)}" class="rounded bg-slate-100 py-1.5 text-[11px] font-bold text-slate-700 hover:bg-slate-200">${sciLabel[k] || esc(k)}</button>`).join('')}</div>
      <div class="grid grid-cols-4 gap-1 p-2">${pad.map((k) => `<button data-action="o-calc" data-k="${esc(k)}" class="rounded py-2 text-sm font-bold ${k === '=' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-800 hover:bg-slate-200'}">${esc(k)}</button>`).join('')}</div>
    </div>`;
}

function renderExamReferences() {
  const o = state.official;
  const p = officialProfiles[o.slug];
  const extra = p.referenceHtml ? 'width:440px;max-width:92vw;' : '';
  const body = p.referenceHtml
    ? p.referenceHtml

  return `
    <div id="exam-refs" class="exam-float exam-panel overflow-hidden rounded-lg border-2 border-slate-400 bg-white" style="left:${o.refPos.x}px; top:${o.refPos.y}px; width:${p.referenceHtml ? '440px' : '320px'}; ${extra}">
      <div data-drag="refs" class="exam-grip flex items-center justify-between border-b border-slate-300 bg-slate-100 px-3 py-1.5">
        <span class="text-xs font-bold">References</span>
        <button type="button" data-action="o-tool" data-tool="references" class="px-1 text-sm font-bold text-slate-500 hover:text-slate-900">&#10005;</button>
