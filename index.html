  const rows = p.tools.map((k) => toolCatalog[k]).filter(Boolean);
  return `
    <div class="fixed inset-0 z-[80] flex items-start justify-center overflow-y-auto bg-slate-900/60 p-6">
      <div class="exam-panel w-full max-w-2xl rounded-xl bg-white p-6">
        <div class="flex items-start justify-between gap-4">
          <div>
            <h3 class="text-lg font-bold">Tool help</h3>
            <p class="exam-muted mt-0.5 text-sm text-slate-500">${esc(p.platform)} · ${esc(p.realStructure)}</p>
          </div>
          <button data-action="o-tool" data-tool="help" class="rounded-lg bg-slate-100 px-3 py-1.5 text-sm font-bold text-slate-700">Close</button>
        </div>
        <ul class="mt-4 space-y-2.5">${rows.map((tool) => `<li class="text-sm"><strong>${esc(tool.name)}</strong> — ${esc(tool.blurb)}</li>`).join('')}
          <li class="text-sm"><strong>Calculator</strong> — ${esc(p.calcNote)}</li>
        </ul>
        <p class="exam-muted mt-4 border-t border-slate-200 pt-3 text-xs text-slate-500">Source: ${esc(p.sources[0].label)}</p>
      </div>
    </div>`;
}

function renderOfficial() {
  const o = state.official;
  const s = subjects.find((x) => x.slug === o.slug);
  const p = officialProfiles[o.slug];
  const sec = officialSection();
  const q = officialQ();
  const inSectionIndex = o.index - sec.start;
  const sectionCount = sec.end - sec.start;
  const isLastInSection = o.index === sec.end - 1;

  return `
  <div class="exam-root ${o.contrast} flex min-h-screen flex-col">
    <header class="exam-bar sticky top-0 z-40 border-b-2 border-slate-300 bg-white">
      <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-2">
        <div class="flex items-center gap-3">
          <span class="grid h-8 w-8 shrink-0 place-items-center rounded-md bg-slate-900 text-[10px] font-extrabold text-white">MD</span>
          <span class="leading-tight">
            <span class="block text-sm font-bold">${esc(s.fullName)}</span>
            <span class="exam-muted block text-[11px] text-slate-500">${esc(p.platform)} — practice simulation</span>
          </span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <span class="exam-muted rounded bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-700">${esc(sec.label)} of ${o.sections.length}</span>
          ${Array.isArray(p.calculatorSections) ? `<span class="exam-muted rounded bg-slate-100 px-2.5 py-1 text-xs font-bold text-slate-700">${sectionHasCalc(p, o.section) ? 'Calculator' : 'No calculator'}</span>` : ''}
          <span class="exam-muted text-xs font-semibold text-slate-500">Question ${inSectionIndex + 1} of ${sectionCount}</span>
          <span class="exam-muted flex items-center gap-1.5 rounded bg-slate-100 px-2.5 py-1">
            <span class="text-[10px] font-bold uppercase text-slate-500">${o.timed ? 'Time left' : 'Elapsed'}</span>
            <span id="exam-timer" class="font-mono text-sm font-bold tabular-nums">${fmtClock(o.timed ? o.secondsLeft : o.elapsed)}</span>
          </span>
          <button data-action="o-flag" class="rounded-md px-2.5 py-1.5 text-xs font-bold ${o.flags[q.id] ? 'bg-amber-400 text-amber-950' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">&#9733; ${o.flags[q.id] ? 'Bookmarked' : 'Bookmark'}</button>
          <button data-action="o-exit" class="rounded-md bg-white px-2.5 py-1.5 text-xs font-bold text-slate-500 ring-1 ring-slate-300 hover:text-slate-900">Exit</button>
        </div>
      </div>
      ${renderExamTools()}
    </header>

    <div id="exam-content" class="grow" style="zoom:${o.zoom}%">
      <div class="mx-auto max-w-4xl px-4 py-6">
        ${o.showReview ? renderExamReview() : renderExamItem()}
      </div>
    </div>

    <footer class="exam-bar sticky bottom-0 z-40 border-t-2 border-slate-300 bg-white">
      <div class="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-3 px-4 py-2.5">
        <button data-action="o-prev" ${o.index <= sec.start || o.showReview ? 'disabled' : ''} class="rounded-lg bg-white px-4 py-2 text-sm font-bold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50 disabled:opacity-40">&#8592; Back</button>
        <div class="flex flex-wrap items-center gap-2">
          ${p.clearBtn && !o.showReview ? '<button data-action="o-clear" class="rounded-lg bg-white px-3 py-2 text-xs font-bold text-slate-600 ring-1 ring-slate-300 hover:bg-slate-50">Clear answer</button>' : ''}
          <button data-action="o-review" class="rounded-lg px-4 py-2 text-sm font-bold ${o.showReview ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50'}">Review</button>
        </div>
        ${o.showReview
          ? '<span class="w-[92px]"></span>'
          : isLastInSection
            ? `<button data-action="o-review" class="rounded-lg bg-slate-900 px-5 py-2 text-sm font-bold text-white hover:bg-slate-700">Finish ${esc(sec.label)} &#8594;</button>`
            : '<button data-action="o-next" class="rounded-lg bg-slate-900 px-5 py-2 text-sm font-bold text-white hover:bg-slate-700">Next &#8594;</button>'}
      </div>
    </footer>

    ${o.tool.notepad ? renderExamNotepad() : ''}
    ${o.tool.calculator && sectionHasCalc(p, o.section) ? renderExamCalculator() : ''}
    ${o.tool.references && p.references ? renderExamReferences() : ''}
    ${o.tool.lineReader ? '<div id="exam-linereader"><div id="exam-lr-top" style="top:0;height:0"></div><div id="exam-lr-bot" style="top:100%;bottom:0"></div></div>' : ''}
    ${o.tool.help ? renderExamHelp() : ''}
  </div>`;
}

function renderOfficialResults() {
  const o = state.official;
  const s = subjects.find((x) => x.slug === o.slug);
  const p = officialProfiles[o.slug];
  const results = o.results || [];
  const byId = {};
  results.forEach((r) => { byId[r.id] = r; });

  const machine = results.filter((r) => r.gradable);
  const correct = machine.filter((r) => r.isCorrect).length;
  const pct = machine.length ? Math.round((correct / machine.length) * 100) : 0;
  const crQs = o.questions.filter((q) => q.type === 'cr');
  const missed = o.questions.filter((q) => byId[q.id] && byId[q.id].gradable && !byId[q.id].isCorrect);
  const flagged = o.questions.filter((q) => o.flags[q.id]);

  const topicMap = new Map();
  o.questions.forEach((q) => {
    const r = byId[q.id];
    if (!r || !r.gradable) return;
    const entry = topicMap.get(q.topicName) || { total: 0, correct: 0 };
    entry.total++;
    if (r.isCorrect) entry.correct++;
    topicMap.set(q.topicName, entry);
  });

  const answerText = (q) => {
    const a = o.answers[q.id];
    if (q.type === 'multi') {
      const arr = Array.isArray(a) ? a : [];
      return arr.length ? arr.map((x) => x.toUpperCase()).sort().join(', ') : 'No answer';
    }
    return a ? String(a).toUpperCase() : 'No answer';
  };
  const keyText = (q) => (q.type === 'multi' ? (q.answer || []).map((x) => x.toUpperCase()).sort().join(', ') : String(q.answer || '').toUpperCase());

  return siteHeader(s.slug) + `
  <main class="wrap">
    <p class="qmeta">${esc(s.fullName)} · ${esc(p.platform.split('(')[0].trim())} · ${o.timed ? 'timed' : 'untimed'} · ${fmtClock(o.elapsed)}</p>
    <p class="score">${pct}%</p>
    <p>${correct} of ${machine.length} machine-scored items correct.${crQs.length ? ' ' + crQs.length + ' constructed response' + (crQs.length === 1 ? '' : 's') + ' to score below. Those are not in the percent.' : ''}</p>
    <p>
      <button type="button" data-action="o-start" data-slug="${s.slug}" class="btn">Retake</button>
      <button type="button" data-action="o-setup" data-slug="${s.slug}" class="btn btn-ghost">Change test or timing</button>
      <button type="button" data-action="o-leave" class="btn btn-ghost">Back to ${esc(s.name)}</button>
    </p>

    <h2>By topic</h2>
    ${[...topicMap.entries()].map(([name, v]) => {
      const tp = v.total ? Math.round((v.correct / v.total) * 100) : 0;
      return `<div>
        <div class="quiz-top"><span>${esc(name)}</span><span>${v.correct}/${v.total} · ${tp}%</span></div>
        <div class="meter"><div class="meter-fill ${themeOf(s).bar}" style="width:${tp}%"></div></div>
      </div>`;
    }).join('')}
    ${flagged.length ? `<p>Bookmarked during the test: ${flagged.length}. Those items are marked below.</p>` : ''}

    <h2>Missed (${missed.length})</h2>
    ${missed.length === 0 ? '<p>Every machine-scored item was correct.</p>' : missed.map((q) => `
      <div class="miss">
        <p class="sub">${esc(q.topicName)}${o.flags[q.id] ? ' · bookmarked' : ''}</p>
        <p><strong>${esc(q.prompt)}</strong></p>
        <p>Your answer: ${esc(answerText(q))}. Correct: ${esc(keyText(q))}.</p>
        <p>${esc(q.explanation)}</p>
      </div>`).join('')}

    ${crQs.length ? `<h2>Constructed responses</h2>
      <p class="sub">These are hand-scored on the real test. Marking one here updates your saved accuracy and does not add another session.</p>
      ${crQs.map((q) => {
        const grade = o.selfGrade[q.id];
        const written = o.answers[q.id];
        const model = (q.sampleResponse && String(q.sampleResponse).trim()) ? nl(q.sampleResponse) : 'No sample is stored for this item.';
        return `<div class="panel">
          <p class="sub">${esc(q.topicName)}${q.points ? ' · ' + q.points + ' points' : ''}</p>
          <p><strong>${esc(q.prompt)}</strong></p>
          <p class="sub">What you wrote</p>
          <p class="passage">${written && String(written).trim() ? esc(written) : 'Left blank.'}</p>
          <p class="sub">Sample</p>
          <p>${model}</p>
          ${Array.isArray(q.rubric) && q.rubric.length ? `<ul class="plain">${q.rubric.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
          <p>
            <button type="button" data-action="o-selfscore" data-qid="${q.id}" data-val="true" class="btn${grade === true ? '' : ' btn-ghost'}">Met the rubric</button>
            <button type="button" data-action="o-selfscore" data-qid="${q.id}" data-val="false" class="btn${grade === false ? '' : ' btn-ghost'}">Did not</button>
          </p>
        </div>`;
      }).join('')}` : ''}

    ${renderToolReference(s.slug)}
  </main>` + siteFooter();
}


function bind() {
  app.querySelectorAll('[data-action]').forEach((el) => {
    const action = el.getAttribute('data-action');
    if (action === 'text') {
      el.addEventListener('input', (e) => {
        const q = state.questions[state.index];
        state.answers[q.id] = e.target.value;
      });
      return;
    }
    if (action === 'o-text') {
      el.addEventListener('input', (e) => { state.official.answers[officialQ().id] = e.target.value; });
      return;
    }
    if (action === 'o-note') {
      el.addEventListener('input', (e) => {
        const o = state.official;
        if (o.noteTab === 'item') o.notes[officialQ().id] = e.target.value;
        else o.globalNote = e.target.value;
      });
      return;
    }
    el.addEventListener('click', () => {
      if (action === 'home') goHome();
      else if (action === 'subject') goSubject(el.getAttribute('data-slug'));
      else if (action === 'quiz') startQuiz(el.getAttribute('data-slug'), el.getAttribute('data-mode'));
      else if (action === 'reset') {
        if (confirm('Reset progress for this subject?')) {
          const data = readProgress();
          delete data[el.getAttribute('data-slug')];
          writeProgress(data);
          render();
        }
      } else if (action === 'choose') {
        const q = state.questions[state.index];
        if (state.checked[q.id]) return;
        const cid = el.getAttribute('data-cid');
        if (q.type === 'multi') {
          const cur = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
          state.answers[q.id] = cur.includes(cid) ? cur.filter((c) => c !== cid) : [...cur, cid];
        } else {
          state.answers[q.id] = cid;
        }
        render();
      } else if (action === 'check' || action === 'skip-cr') {
        const q = state.questions[state.index];
        state.checked[q.id] = true;
        if (action === 'skip-cr' && state.selfGrade[q.id] === undefined) {
          state.selfGrade[q.id] = false;
        }
        render();
      } else if (action === 'next') {
        if (state.index === state.questions.length - 1) finishQuiz();
        else { state.index++; render(); }
      } else if (action === 'prev') {
        if (state.index > 0) { state.index--; render(); }
      } else if (action === 'grade') {
        const q = state.questions[state.index];
        state.selfGrade[q.id] = el.getAttribute('data-val') === 'true';
        render();
      } else if (action === 'toggle-ebas') {
        state.ebasOpen = !state.ebasOpen;
        render();
      }

      /* ---- Official Test Mode ---- */
      else if (action === 'o-setup') {
        stopOfficialTimer();
        state.official = null;
        const slug = el.getAttribute('data-slug');
        if (slug) state.setupSlug = slug;
        state.view = 'official-setup';
        render();
      } else if (action === 'o-pick') {
        state.setupSlug = el.getAttribute('data-slug');
        render();
      } else if (action === 'o-timed') {
        state.setupTimed = el.getAttribute('data-val') === 'true';
        render();
      } else if (action === 'o-start') {
        startOfficial(el.getAttribute('data-slug') || state.setupSlug, state.setupTimed);
      } else if (action === 'o-exit') {
        exitOfficial(false);
      } else if (action === 'o-leave') {
        exitOfficial(true);
      } else if (action === 'o-tool') {
        const o = state.official;
        const tool = el.getAttribute('data-tool');
        o.tool[tool] = !o.tool[tool];
        if (tool === 'highlighter' && !o.tool.highlighter) o.hlErase = false;
        render();
      } else if (action === 'o-hlcolor') {
        state.official.hlColor = el.getAttribute('data-color');
        state.official.hlErase = false;
        render();
      } else if (action === 'o-hlerase') {
        state.official.hlErase = !state.official.hlErase;
        render();
      } else if (action === 'o-hlclear') {
        const o = state.official;
        const q = officialQ();
        const scopes = ['passage', 'prompt'];
        if (q.ebas) {
          scopes.push('ebas-bg');
          q.ebas.sources.forEach((src, si) => scopes.push('ebas-src-' + si));
        }
        scopes.forEach((sc) => { delete o.highlights[hlKey(q, sc)]; });
        render();
      } else if (action === 'o-zoom') {
        const o = state.official;
        const steps = [100, 150, 200, 300];
        const dir = el.getAttribute('data-dir');
        const i = Math.max(0, steps.indexOf(o.zoom));
        if (dir === 'reset') o.zoom = 100;
        else if (dir === 'in') o.zoom = steps[Math.min(steps.length - 1, i + 1)];
        else o.zoom = steps[Math.max(0, i - 1)];
        render();
      } else if (action === 'o-contrast') {
        const o = state.official;
        const i = contrastModes.findIndex((c) => c.id === o.contrast);
        o.contrast = contrastModes[(i + 1) % contrastModes.length].id;
        render();
      } else if (action === 'o-choose') {
        const o = state.official;
        const q = officialQ();
        const cid = el.getAttribute('data-cid');
        if (o.tool.eliminator) { toggleChoiceFlag(o.eliminated, q.id, cid); render(); return; }
        if ((o.eliminated[q.id] || {})[cid] || (o.masked[q.id] || {})[cid]) return;
        if (q.type === 'multi') {
          const cur = Array.isArray(o.answers[q.id]) ? o.answers[q.id] : [];
          o.answers[q.id] = cur.includes(cid) ? cur.filter((x) => x !== cid) : [...cur, cid];
        } else {
          o.answers[q.id] = cid;
        }
        render();
      } else if (action === 'o-elim') {
        toggleChoiceFlag(state.official.eliminated, officialQ().id, el.getAttribute('data-cid'));
        render();
      } else if (action === 'o-mask') {
        toggleChoiceFlag(state.official.masked, officialQ().id, el.getAttribute('data-cid'));
        render();
      } else if (action === 'o-flag') {
        const o = state.official;
        const id = officialQ().id;
        if (o.flags[id]) delete o.flags[id]; else o.flags[id] = true;
        render();
      } else if (action === 'o-clear') {
        delete state.official.answers[officialQ().id];
        render();
      } else if (action === 'o-next') {
        const o = state.official;
        if (o.index < officialSection().end - 1) { o.index++; o.sectionExpired = false; render(); }
      } else if (action === 'o-prev') {
        const o = state.official;
        if (o.index > officialSection().start) { o.index--; o.sectionExpired = false; render(); }
      } else if (action === 'o-review') {
        const o = state.official;
        o.showReview = !o.showReview;
        o.sectionExpired = false;
        render();
      } else if (action === 'o-goto') {
        const o = state.official;
        o.index = Number(el.getAttribute('data-i'));
        o.showReview = false;
        render();
      } else if (action === 'o-turnin') {
        const o = state.official;
        const sec = officialSection();
        const last = o.section === o.sections.length - 1;
        const unanswered = o.questions.slice(sec.start, sec.end).filter((q) => !officialAnswered(q)).length;
        const warn = unanswered ? `You have ${unanswered} unanswered item${unanswered === 1 ? '' : 's'}. ` : '';
        if (last) {
          if (confirm(warn + 'Turn in the whole test? You cannot change any answers after this.')) submitOfficial();
        } else if (confirm(warn + `Turn in ${sec.label}? You will not be able to return to it.`)) {
          advanceSection(false);
        }
      } else if (action === 'o-notetab') {
        state.official.noteTab = el.getAttribute('data-tab');
        render();
      } else if (action === 'o-calcdeg') {
        state.official.calcDeg = !state.official.calcDeg;
        render();
      } else if (action === 'o-calc') {
        const o = state.official;
        const k = el.getAttribute('data-k');
        if (k === 'C') o.calcExpr = '';
        else if (k === 'back') o.calcExpr = o.calcExpr.slice(0, -1);
        else if (k === '=') {
          try { o.calcExpr = String(Number(calcEval(o.calcExpr, o.calcDeg).toPrecision(12))); }
          catch (err) { o.calcExpr = 'Error'; }
        } else {
          if (o.calcExpr === 'Error') o.calcExpr = '';
          o.calcExpr += ['sqrt', 'ln', 'log', 'sin', 'cos', 'tan'].includes(k) ? k + '(' : k;
        }
        render();
      } else if (action === 'o-selfscore') {
        const o = state.official;
        const qid = el.getAttribute('data-qid');
        const ok = el.getAttribute('data-val') === 'true';
        o.selfGrade[qid] = ok;
        applySelfScore(o.slug, qid, ok);
        render();
      }
    });
  });
  bindOfficial();
}

function toggleChoiceFlag(map, qid, cid) {
  const next = { ...(map[qid] || {}) };
  if (next[cid]) delete next[cid]; else next[cid] = true;
  map[qid] = next;
}

/* ---- Direct DOM interactions that cannot live in the template: text
   selection for the highlighter, dragging/resizing floating tools, and the
   line reader. All committed to state so they survive the next re-render. ---- */

let dragCtx = null;
let resizeCtx = null;
let lineReaderMove = null;

function bindOfficial() {
  const o = state.official;
  if (!o || state.view !== 'official') { detachLineReader(); return; }

  const content = document.getElementById('exam-content');
  if (content && o.tool.highlighter) content.addEventListener('mouseup', applySelectionHighlight);

  app.querySelectorAll('[data-drag]').forEach((h) => {
    h.addEventListener('mousedown', (e) => startExamDrag(e, h.getAttribute('data-drag')));
  });
  app.querySelectorAll('[data-resize]').forEach((h) => {
    h.addEventListener('mousedown', (e) => startExamResize(e, h.getAttribute('data-resize')));
  });

  if (o.tool.lineReader) attachLineReader(); else detachLineReader();
}

function applySelectionHighlight() {
  const o = state.official;
  if (!o || !o.tool.highlighter) return;
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  let node = range.commonAncestorContainer;
  if (node.nodeType === 3) node = node.parentNode;
  const root = node && node.closest ? node.closest('[data-hl-key]') : null;
  if (!root) return;
  const key = root.getAttribute('data-hl-key');
  const pre = range.cloneRange();
  pre.selectNodeContents(root);
  pre.setEnd(range.startContainer, range.startOffset);
  const start = pre.toString().length;
  const end = start + range.toString().length;
  if (end <= start) return;
  const list = o.highlights[key] || [];
  o.highlights[key] = o.hlErase ? hlSubtract(list, start, end) : hlAdd(list, start, end, o.hlColor);
  sel.removeAllRanges();
  render();
}

const dragTargets = { note: ['exam-notepad', 'notePos'], calc: ['exam-calc', 'calcPos'], refs: ['exam-refs', 'refPos'] };

function startExamDrag(e, which) {
  const cfg = dragTargets[which];
  const o = state.official;
  if (!cfg || !o) return;
  if (e.target.closest && e.target.closest('button')) return;
  const elm = document.getElementById(cfg[0]);
  if (!elm) return;
  e.preventDefault();
  dragCtx = { elm, key: cfg[1], dx: e.clientX - o[cfg[1]].x, dy: e.clientY - o[cfg[1]].y };
  document.addEventListener('mousemove', onExamDragMove);
  document.addEventListener('mouseup', endExamDrag);
}

function onExamDragMove(e) {
  if (!dragCtx || !state.official) return;
  const x = Math.max(0, Math.min(window.innerWidth - 80, e.clientX - dragCtx.dx));
  const y = Math.max(0, Math.min(window.innerHeight - 40, e.clientY - dragCtx.dy));
  state.official[dragCtx.key] = { x, y };
  dragCtx.elm.style.left = x + 'px';
  dragCtx.elm.style.top = y + 'px';
}

function endExamDrag() {
  dragCtx = null;
  document.removeEventListener('mousemove', onExamDragMove);
  document.removeEventListener('mouseup', endExamDrag);
}

function startExamResize(e, which) {
  const o = state.official;
  if (which !== 'note' || !o) return;
  const elm = document.getElementById('exam-notepad');
  if (!elm) return;
  e.preventDefault();
  resizeCtx = { elm, x: e.clientX, y: e.clientY, w: o.noteSize.w, h: o.noteSize.h };
  document.addEventListener('mousemove', onExamResizeMove);
  document.addEventListener('mouseup', endExamResize);
}

function onExamResizeMove(e) {
  if (!resizeCtx || !state.official) return;
  const w = Math.max(220, resizeCtx.w + (e.clientX - resizeCtx.x));
  const h = Math.max(180, resizeCtx.h + (e.clientY - resizeCtx.y));
  state.official.noteSize = { w, h };
  resizeCtx.elm.style.width = w + 'px';
  resizeCtx.elm.style.height = h + 'px';
}

function endExamResize() {
  resizeCtx = null;
  document.removeEventListener('mousemove', onExamResizeMove);
  document.removeEventListener('mouseup', endExamResize);
}

function attachLineReader() {
  detachLineReader();
  lineReaderMove = (e) => {
    const o = state.official;
    if (!o || !o.tool.lineReader) return;
    const top = document.getElementById('exam-lr-top');
    const bot = document.getElementById('exam-lr-bot');
    if (!top || !bot) return;
    const half = o.lineWindow / 2;
    top.style.top = '0px';
    top.style.height = Math.max(0, e.clientY - half) + 'px';
    bot.style.top = Math.max(0, e.clientY + half) + 'px';
    bot.style.bottom = '0px';
  };
  document.addEventListener('mousemove', lineReaderMove);
}

function detachLineReader() {
  if (lineReaderMove) {
    document.removeEventListener('mousemove', lineReaderMove);
    lineReaderMove = null;
  }
}

render();
  </script>
